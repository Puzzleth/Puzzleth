# Tests and builds the Nightly branch, and publishes the build to the nightly branch of the private
# Puzzleth-builds repository, where the Android app looks for updates (see
# tools/android/src/net/puzzleth/game/MainActivity.java). The web version is only deployed from main
# (web.yml).
#
# One-time setup: create the private repository Puzzleth/Puzzleth-builds, and add a fine-grained token
# with read and write access to its contents as this repository's secret BUILDS_TOKEN.
name: Nightly build

on:
  push:
    branches: [Nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          SDL_VIDEODRIVER: dummy
      - run: pip install pygbag==0.9.2 fonttools
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)   # converts added .wav/.mp3
      - run: tools/build_web.sh

      - name: Publish to Puzzleth-builds
        working-directory: build/web
        run: |
          git init -q -b nightly
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Nightly build $(cat version.txt) from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.BUILDS_TOKEN }}@github.com/${{ github.repository_owner }}/Puzzleth-builds.git" nightly
