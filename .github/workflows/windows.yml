# Builds Puzzleth.exe, a single Windows program with Python and the game inside (PyInstaller), so it
# can be played offline without installing anything. Pushing a version tag (git tag v0.0.2 && git push
# origin v0.0.2) also publishes it on the repository's Releases page; the tag must match VERSION in
# puzzleth/__init__.py. Run it by hand from the Actions tab to just get the .exe as an artifact.
name: Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.9.0 pillow==10.4.0   # pillow turns the icon into an .ico

      - name: Check the tag matches the game's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import puzzleth; print(puzzleth.VERSION)")
          [[ "${GITHUB_REF_NAME}" == "v$version" ]] || { echo "tag ${GITHUB_REF_NAME} isn't v$version"; exit 1; }

      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Puzzleth --icon tools/web/favicon.png
          --add-data "puzzleth/fonts:puzzleth/fonts" --add-data "puzzleth/sounds:puzzleth/sounds"
          --add-data "puzzleth/music:puzzleth/music" main.py

      - name: Smoke test (run it for 120 frames without a screen)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PUZZLETH_QUIT_AFTER: "120"
          PUZZLETH_HOME: ${{ runner.temp }}\puzzleth\profile.json
          PUZZLETH_SERVER: "-"
        run: |
          $p = Start-Process dist\Puzzleth.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Puzzleth.exe didn't close" }
          if ($p.ExitCode -ne 0) { throw "Puzzleth.exe exited with $($p.ExitCode)" }

      - name: Name it after the version
        shell: bash
        run: |
          version=$(python -c "import puzzleth; print(puzzleth.VERSION)")
          mv dist/Puzzleth.exe "dist/Puzzleth-$version-windows.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Puzzleth-windows
          path: dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the release
    steps:
      - uses: actions/download-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4
        with:
          name: Puzzleth-windows
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.exe
          prerelease: true   # pre-alpha
          body: |
            Download the `.exe` below and run it: no Python or install needed, and it plays offline (the leaderboard needs a connection).
            Windows may warn that it's from an unknown publisher, because it isn't code-signed: choose "More info", then "Run anyway".
            Progress is saved in your user folder, under `.puzzleth`.
